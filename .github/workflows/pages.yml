name: Deploy Forward Thinking website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify brand image
        shell: bash
        run: |
          cat > /tmp/chunks.sha256 <<'EOF'
          a88161ab658b40c38616ff9045208ae309e388297ec050fd5d2c7f47e3e06fd1  assets/brand-v2-part01a.txt
          ce25942cffe76a128369299997b9ee2b075bd9ff45df86231f3c60cb5be04f2d  assets/brand-v2-part01b.txt
          97abe53be3569026078f512c2942890307e93b03d761e773c0b6b4a324aaa028  assets/brand-v2-part02a.txt
          bb1fca278680c887a5fbe95e929cad1ae271515770c2483066d8904e8682eae4  assets/brand-v2-part02b.txt
          a5bdc2734a57b36783e08b3b44416549f8e8a6971a997792fcfb319a5b2d6c4f  assets/brand-v2-part03.txt
          c0d109ab331a779cbcb469807677f35a5db12d43cf04a25c50d0a3d25f17e71f  assets/brand-v2-part04.txt
          fd1df29653b90ed03c227b3480f13c5bb3de08d218987317a26da1a3454cdf54  assets/brand-v2-part05.txt
          3d9754e6f95810e1ab4937f6ba646540bb7647ba37b75433007bdae75b91c116  assets/brand-v2-part06a.txt
          2fb6f615c64540da8ef17467ebc60d57fae4b4ace8c95173129c8902ee9d9800  assets/brand-v2-part06b.txt
          25689aa23ef1d075148d0f705a64373f4494fb90110f659859b26827de846914  assets/brand-v2-part07.txt
          5c86892b40109ffa5d221c994cae8553c2131b5b0e4dd8d7356d2cdb7a6ed015  assets/brand-v2-part08.txt
          8396ef72dc0c6061291dfde8105af5a7417f1037576bd326ee2be60d21e040fa  assets/brand-v2-part09.txt
          EOF
          sha256sum -c /tmp/chunks.sha256
          cat assets/brand-v2-part01a.txt assets/brand-v2-part01b.txt \
              assets/brand-v2-part02a.txt assets/brand-v2-part02b.txt \
              assets/brand-v2-part03.txt assets/brand-v2-part04.txt assets/brand-v2-part05.txt \
              assets/brand-v2-part06a.txt assets/brand-v2-part06b.txt \
              assets/brand-v2-part07.txt assets/brand-v2-part08.txt assets/brand-v2-part09.txt > /tmp/brand.b64
          base64 --decode /tmp/brand.b64 > assets/forward-thinking-brand.jpg
          echo "b767518d13500bad9fcd1b3b96331a7a7e550a87b44db75bd9d50d0979f22576  assets/forward-thinking-brand.jpg" | sha256sum -c -
          test "$(stat -c%s assets/forward-thinking-brand.jpg)" = "40117"
          file assets/forward-thinking-brand.jpg | grep -q "JPEG image data"
          rm -f assets/brand-v2-part*.txt assets/brand.b64 assets/forward-thinking-brand.webp

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
