name: Deploy Forward Thinking website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and verify brand image
        shell: bash
        run: |
          mkdir -p assets
          base64 --decode assets/brand.b64 > assets/forward-thinking-brand.jpg
          echo "74347bb8afd9b2a055fb11f2317e9e4214e484cf6fb60a5d4be964a1700312d2  assets/forward-thinking-brand.jpg" | sha256sum -c -
          file assets/forward-thinking-brand.jpg | grep -q "JPEG image data"
          test -s assets/forward-thinking-brand.jpg
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
